name: Build AutoLedger APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Fix Escape & Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle.kts' | head -n 1)")
          cd "$PROJECT_DIR"
          python3 -c '
          p = "app/src/main/java/com/personal/autoledger/BillParser.kt"
          t = open(p).read().replace("\\\\s", "\\s").replace("\\\\.", "\\.").replace("\\s", "\\\\s").replace("\\.", "\\\\.")
          open(p, "w").write(t)
          m = "app/src/main/AndroidManifest.xml"
          open(m, "w").write(open(m).read().replace("package=\"com.personal.autoledger\"", ""))
          '
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLedger-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
